# Гиперпараметры обучения для ИК-детекции огня
# Оптимизированы для thermal/IR imagery

# Оптимизатор
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Расписание
epochs: 150
patience: 30
batch: 32           # RTX 4090 24GB VRAM — хватает на 32 при imgsz=1024
imgsz: 1024

# Веса функции потерь
box: 7.5
cls: 0.5
dfl: 1.5

# Аугментации (ИК-специфичные)
hsv_h: 0.0        # НЕТ hue — нет цвета в ИК
hsv_s: 0.0        # НЕТ saturation — нет цвета в ИК
hsv_v: 0.3        # Вариация яркости — имитация разных условий
degrees: 15.0
translate: 0.2
scale: 0.5
shear: 5.0
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.1

# Warmup
warmup_epochs: 5
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Разное
close_mosaic: 15
cos_lr: true
